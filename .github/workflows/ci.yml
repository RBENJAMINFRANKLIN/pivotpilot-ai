name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pivotpilot, POSTGRES_PASSWORD: pivotpilot, POSTGRES_DB: pivotpilot }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migrations match models
        run: python -m app.cli init && alembic check
        env: { DATABASE_URL: postgresql://pivotpilot:pivotpilot@localhost/pivotpilot }
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://pivotpilot:pivotpilot@localhost/pivotpilot" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vitest run
      - run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd backend && python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && npx playwright test
        env: { E2E_START_SERVERS: "1" }
